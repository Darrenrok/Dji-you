<!DOCTYPE html>
            <html>
            <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.cdnfonts.com/css/font-breakdown" rel="stylesheet">
                
                
            <style>
                *{margin:0;padding:0;box-sizing:border-box}
                body{background:#0a0e1a;color:#e0e6ed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
                    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:60px 40px}
                h1{color:#00E5FF;font-size:48px;margin-bottom:10px;text-shadow:0 0 30px rgba(0,229,255,0.3)}
                p{color:#6b7280;margin-bottom:50px;font-size:18px;text-align:center;max-width:800px;line-height:1.5}
                .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px;width:100%;max-width:1200px}
                .tile{background:#111827;border:2px solid #1f2937;border-radius:16px;padding:40px 20px;
                      text-align:center;cursor:pointer;transition:all .18s ease;outline:none}
                .tile:focus,.tile:hover{border-color:#00E5FF;transform:scale(1.06);
                      box-shadow:0 0 0 4px rgba(0,229,255,0.2),0 0 30px rgba(0,229,255,0.15)}
                .icon{font-size:48px;margin-bottom:16px;display:block}
                .label{font-size:20px;font-weight:700;color:#f3f4f6}
                .url{font-size:13px;color:#6b7280;margin-top:6px}
            #title{
            font-family: 'font breakdown', sans-serif;
  
            }
            </style>
            </head>
            <body>
           <center> <div id="title"><h1 style="color:white;">Project_tv</h1></div></center>
                <div class="grid">
                    <div class="tile" data-tv-focusable tabindex="0" onclick="location.href='https://tbcpl.lol/'">
                        <span class="icon">&#x1F4FA;</span><div class="label">tbcpl</div><div class="url">tbcpl</div>
                    </div>
                    <div class="tile" data-tv-focusable tabindex="0" onclick="location.href='https://pantyflix.com/'">
                        <span class="icon">&#x1F3AE;</span><div class="label">pantyflix</div><div class="url">pantyflix</div>
                    </div>
                    <div class="tile" data-tv-focusable tabindex="0" onclick="location.href='https://vyla.cc/'">
                        <span class="icon">&#x1F3AC;</span><div class="label">vyla</div><div class="url">vyla</div>
                    </div>
                    <div class="tile" data-tv-focusable tabindex="0" onclick="location.href='https://www.1flex.org/'">
                        <span class="icon">&#x2728;</span><div class="label">1flex+</div><div class="url">1flex</div>
                    </div>
                    <div class="tile" data-tv-focusable tabindex="0" onclick="location.href='https://vidbox.dev/'">
                        <span class="icon">&#x1F4E1;</span><div class="label">vidbox</div><div class="url">vidbox</div>
                    </div>
                    <div class="tile" data-tv-focusable tabindex="0" onclick="location.href='https://plushub.net/'">
                        <span class="icon">&#x1F4E6;</span><div class="label">plushub</div><div class="url">plushub</div>
                    </div>
                 
                    <div class="tile" data-tv-focusable tabindex="0" onclick="location.href='https://www.google.com'">
                        <span class="icon">&#x1F50D;</span><div class="label">Google</div><div class="url">google</div>
                    </div>
                </div>
            </body>
            </html>
